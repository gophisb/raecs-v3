version: "2"
purpose: "Operate and evolve RAECS under the RAFEEQ Engineering Constitution V3"
allowed_paths:
  - "README.md"
  - "RUNBOOK.md"
  - "RAFEEQ_CONSTITUTION.md"
  - "RAECS_POLICY.yaml"
  - "RAECS_INTENT.yaml"
  - "PROJECT_STATE.md"
  - "TASK_LEDGER.md"
  - "EVALS/"
  - "DECISIONS/"
  - "OPLOG/"
  - "scripts/"
  - "RAECS_EXECUTABLES_ALLOWLIST.txt"
forbidden_actions:
  - "execute unreviewed downloaded code"
  - "exfiltrate secrets or private data"
  - "modify governance boundaries without human approval"
  - "disable or bypass a mandatory gate"
  - "silently broaden task scope"
requires_human_approval:
  - "governance changes"
  - "security-boundary changes"
  - "permission expansion"
  - "production release"
  - "destructive operations"
