name: RAECS Governance Gate

on:
  push:
  pull_request:

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Install required analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          python -m pip install pyyaml bandit pip-audit semgrep
          go install github.com/gitleaks/gitleaks/v8@v8.24.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Change impact smoke tests
        run: bash scripts/test-change-impact.sh
      - name: Release gate
        run: bash scripts/release-gate.sh
